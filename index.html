<!doctype html>
<html lang="en">
<head>
<script>window.CARDS_STATIC = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117; --panel:#181b24; --line:#2a2f3d; --text:#e7e9ee; --dim:#8b91a1; --acc:#9147ff;
    --c:#cdd2de; --r:#ffc845; --h:#b98cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 Inter, system-ui, sans-serif; }
  a { color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  .top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .top a.home { text-decoration:none; color:var(--dim); font-weight:700; }
  .top a.home:hover { color:var(--text); }
  form.find { display:flex; gap:8px; }
  input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font:inherit; width:190px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; font-weight:700; cursor:pointer; }

  h1 { font-family:"Lilita One", Impact, sans-serif; font-weight:400; font-size:40px; margin:0 0 4px; line-height:1.1; }
  .sub { color:var(--dim); margin-bottom:18px; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; }
  .stat b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .bar { height:10px; background:var(--panel); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-bottom:26px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg, #9147ff, #4dd2ff); }

  /* grid */
  h2 { font-family:"Lilita One", Impact, sans-serif; font-weight:400; font-size:26px; margin:34px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px; }
  .slot { display:flex; flex-direction:column; gap:8px; }
  .frame { border-radius:14px; padding:5px; aspect-ratio:5/7; position:relative; box-shadow:0 8px 20px rgba(0,0,0,.4); }
  .frame.C { background:var(--steel); }
  .frame.R { background:var(--r); box-shadow:0 0 18px rgba(255,200,70,.35), 0 8px 20px rgba(0,0,0,.4); }
  .frame.H { background:conic-gradient(from 0deg, #ff6b6b, #ffd93d, #6bff95, #4dd2ff, #b98cff, #ff6b6b);
             box-shadow:0 0 22px rgba(185,140,255,.45), 0 8px 20px rgba(0,0,0,.4); }
  /* cards not found yet show a faded card back (art/back.png if you've added one) */
  .frame.none { background:none; box-shadow:none; padding:0; opacity:.32; filter:saturate(.6); }
  .backface { width:100%; height:100%; border-radius:14px; position:relative; border:6px solid #0e1230;
              background:repeating-conic-gradient(from 45deg at 50% 50%, #1b2350 0 15deg, #222c63 15deg 30deg), #1b2350; }
  .backface::before { content:""; position:absolute; inset:9px; border-radius:8px; border:2px solid rgba(255,255,255,.25); }
  .backface::after { content:""; position:absolute; left:50%; top:50%; width:34%; aspect-ratio:1;
                     transform:translate(-50%,-50%) rotate(45deg); border-radius:8%;
                     background:linear-gradient(135deg, #fff, #9aa8ff); box-shadow:0 0 18px rgba(160,180,255,.8); }
  /* "Show missing cards": a card someone else has pulled, in greyscale, in place of the card back */
  .frame.ghost { display:none; background:#2a2e3a; box-shadow:none; filter:grayscale(1) brightness(.75); opacity:.8; }
  .show-missing .frame.ghost { display:block; }
  .show-missing .frame.ghost + .frame.none { display:none; }
  /* "Not found: Hide": only the cards you own, no gaps */
  .hide-missing .slot:not(.owned) { display:none; }
  .hide-missing .no-promos { display:none; }
  /* the view switches above the grid (Not found: Card backs / Grey / Hide, Alt arts: Stacked / Separate) */
  .views { display:flex; flex-wrap:wrap; gap:10px 18px; margin:-12px 0 20px; }
  /* search the grid: name, number, source, series (only what the page already shows) */
  .finder { display:flex; align-items:center; gap:10px; margin:-12px 0 22px; }
  .finder input { flex:1; width:auto; max-width:460px; }
  .finder .count { color:var(--dim); font-size:13px; }
  .finder .clear { background:none; border:1px solid var(--line); color:var(--dim); padding:7px 12px; }
  .nomatch { display:none !important; }
  .nohits { color:var(--dim); padding:30px 0; text-align:center; }
  .seg { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); font-weight:700; }
  .seg .opts { display:inline-flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:var(--panel); }
  .seg button { background:none; color:var(--text); border:none; padding:6px 13px; font-weight:700; font-size:13px; cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button:hover { background:rgba(255,255,255,.05); }
  .seg button[aria-pressed="true"] { background:#2c2250; color:#cdbbff; }
  .custom-back .backface { background:var(--back-img) center / cover no-repeat; border:none; }
  .custom-back .backface::before, .custom-back .backface::after { display:none; }
  .face { width:100%; height:100%; border-radius:10px; overflow:hidden; position:relative; }
  .face img { width:100%; height:100%; object-fit:cover; display:block; }
  .face img.bdr { position:absolute; inset:0; object-fit:fill; pointer-events:none; }
  .ph { height:100%; padding:12px; display:flex; flex-direction:column; justify-content:space-between; color:#fff;
        background:linear-gradient(160deg, hsl(var(--hue) 70% 45%), hsl(calc(var(--hue) + 50) 60% 18%)); }
  .ph .n { font-family:"Lilita One", Impact, sans-serif; font-size:54px; line-height:1; opacity:.92; }
  .ph.tx { justify-content:center; align-items:center; }
  .ph.tx .n { font-size:36px; }
  .big .ph.tx .n { font-size:64px; }
  .ph .t { font-family:"Lilita One", Impact, sans-serif; font-size:20px; line-height:1.1; }
  /* click a card to enlarge it */
  .slot.owned { cursor:zoom-in; }
  .slot.owned .frame { transition:transform .15s; }
  .slot.owned:hover .frame, .slot.owned:focus-visible .frame { transform:translateY(-4px); }
  .slot.owned:focus-visible { outline:2px solid var(--acc); outline-offset:4px; border-radius:16px; }
  body.modal-open { overflow:hidden; }
  .mback { position:fixed; inset:0; z-index:50; background:rgba(5,6,10,.86); display:flex; align-items:center;
           justify-content:center; padding:20px; animation:fade .15s; overflow-y:auto; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .mbox { display:flex; flex-direction:column; align-items:center; gap:16px; max-width:100%; margin:auto;
          --room-borders:0px; --room-arts:0px; --room-hand:0px; --room-sc:0px;   /* not --h: that is the holo colour */ }
  /* the big card shrinks to leave room for whatever sits under it (border grid, art row, a plugin's button) */
  .mbox.multi { --room-borders:60px; } .mbox.arts { --room-arts:46px; } .mbox:has(.hadd) { --room-hand:54px; }
  .big { width:min(400px, 82vw, max(180px, calc((100vh - 230px - var(--room-borders) - var(--room-arts) - var(--room-hand) - var(--room-sc) - var(--room-info)) * 5 / 7))); perspective:900px; }
  .big .frame { width:100%; border-radius:22px; padding:8px; transition:transform .12s ease-out; will-change:transform; }
  /* a horizontal promo: a wide box, with the same portrait card turned clockwise inside it. `rotate` and `translate` are
     separate from `transform`, which the pointer tilt below sets. */
  .big.side { --w:min(560px, 88vw, max(252px, calc((100vh - 230px - var(--room-borders) - var(--room-arts) - var(--room-hand) - var(--room-sc) - var(--room-info)) * 7 / 5)));
              width:var(--w); height:calc(var(--w) * 5 / 7); position:relative; }
  .big.side .frame { position:absolute; left:50%; top:50%; width:calc(var(--w) * 5 / 7); translate:-50% -50%; rotate:90deg; }
  .big .face { border-radius:15px; }
  .big .ph { padding:6%; }
  .big .ph .n { font-size:clamp(60px, 14vw, 110px); }
  .big .ph .t { font-size:clamp(22px, 5vw, 38px); }
  /* name, source and series of the enlarged card: under it on a small window, beside it (with the buttons) on a wide one */
  .mside { display:flex; flex-direction:column; align-items:center; gap:14px; max-width:100%; }
  .minfo { text-align:center; display:flex; flex-direction:column; gap:4px; }
  .mname { font-family:"Lilita One", Impact, sans-serif; font-size:30px; line-height:1.1; overflow-wrap:anywhere; }
  .mfacts { color:var(--dim); font-size:14px; line-height:1.5; }
  .mfacts b { color:var(--text); font-weight:700; }
  .mbox { --room-info:62px; }
  @media (min-width:900px) and (min-height:480px) {
    .mbox { flex-direction:row; align-items:center; gap:36px; --room-info:0px; }
    .mside { width:340px; }
    .mside .mtabs.grid2 { width:100%; }
    .mbox .big { width:min(460px, calc(100vw - 560px), max(200px, calc((100vh - 60px) * 5 / 7))); }
    .mbox .big.side { --w:min(640px, calc(100vw - 560px), max(280px, calc((100vh - 60px) * 7 / 5))); }
  }
  .mtabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .tab { border:0; border-radius:99px; padding:7px 16px; font:inherit; font-weight:800; font-size:14px; color:#111;
         cursor:pointer; font-variant-numeric:tabular-nums; outline:2px solid transparent; outline-offset:2px; }
  .mtabs.grid2 { display:grid; grid-template-columns:repeat(var(--cols), minmax(0, 1fr)); gap:6px; width:min(400px, 88vw); }
  .mtabs.grid2 .tab { padding:6px 8px; font-size:13px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tab.C { background:var(--c); } .tab.R { background:var(--r); } .tab.H { background:var(--h); }
  .tab.z { background:#232837; color:#7a8296; }
  .tab.sel { outline-color:#fff; }
  .tab:focus-visible { outline-color:var(--acc); }
  .mnote { min-height:20px; color:var(--dim); font-size:14px; text-align:center; }
  .mhint { display:none; color:#5d6579; font-size:12px; }
  @media (hover:hover) { .mhint { display:block; } }
  .big .frame.none { opacity:1; filter:brightness(.55) saturate(.7); border-radius:22px; background:#0b0d14; }
  .mclose, .mnav { position:fixed; background:rgba(255,255,255,.1); color:#fff; border:0; width:44px; height:44px;
                   border-radius:50%; font-size:22px; line-height:1; padding:0; }
  .mclose:hover, .mnav:hover { background:rgba(255,255,255,.22); }
  .mclose { top:16px; right:16px; }
  .mnav { top:50%; transform:translateY(-50%); }
  .mnav.prev { left:16px; } .mnav.next { right:16px; }
  @media (max-width:640px) { .mnav { top:auto; bottom:16px; transform:none; } }
  /* phones: two cards a row, and a smaller enlarged card with room under it for the ‹ › buttons */
  @media (max-width:560px) {
    .wrap { padding:14px 12px 50px; }
    h1 { font-size:32px; }
    .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px 12px; }
    .frame { border-radius:11px; padding:4px; }
    .slot { gap:6px; }
    .meta { gap:4px; }
    .pill { font-size:11px; padding:1px 6px; }
    .altpill { font-size:10px; padding:1px 6px; }
    .pile::before { transform:translate(4px, 2px) rotate(3deg); }
    .pile::after { transform:translate(7px, 4px) rotate(6deg); }
    .slot.owned:hover .pile::before, .slot.owned:hover .pile::after { transform:none; }   /* no hover on a phone */
    .stat { padding:8px 12px; } .stat b { font-size:19px; }
    .mback { padding:14px 12px 74px; }        /* the ‹ › buttons sit at the bottom: keep them off the version buttons */
    .mbox { gap:12px; }
    .big { width:min(400px, 64vw, max(170px, calc((100vh - 290px - var(--room-borders) - var(--room-arts) - var(--room-hand) - var(--room-sc) - var(--room-info)) * 5 / 7))); }
    .big .frame { border-radius:16px; padding:6px; }
    .mtabs.grid2 { width:min(400px, 92vw); }
    .tab { padding:6px 12px; font-size:13px; }
    .mtabs.grid2 .tab { padding:5px 6px; font-size:12px; }
  }
  .meta { display:flex; justify-content:center; align-items:center; gap:6px; min-height:26px; }
  .meta .nm { font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pills { display:flex; gap:4px; flex-shrink:0; }
  .pill { font-size:12px; font-weight:800; padding:2px 7px; border-radius:99px; color:#111; font-variant-numeric:tabular-nums; }
  .pill.C { background:var(--c); } .pill.R { background:var(--r); } .pill.H { background:var(--h); }
  .pill.z { background:#232837; color:#555d70; }
  .meta { flex-wrap:wrap; }
  .altpill { font-size:11px; font-weight:800; letter-spacing:.04em; padding:2px 8px; border-radius:99px; color:#fff;
             background:linear-gradient(135deg, #7b4dff, #c04dff); white-space:nowrap; }
  .altpill.ltd { background:linear-gradient(135deg, #b8860b, #e8b923); color:#241800; }
  .altpill.ret { background:#3a3f4c; color:#e6e9f0; border:1px solid #6b7180; }
  .mlimit { text-align:center; font-size:14px; color:var(--dim); margin:2px 0 8px; line-height:1.7; }
  .mlimit b { color:var(--text); font-variant-numeric:tabular-nums; }
  .mlimit .ser { font-family:ui-monospace, Consolas, monospace; letter-spacing:.06em; }
  .mlimit .lim { color:#f0c24b; }
  .altpill.has { background:#2c2250; color:#cdbbff; border:1px solid #5d46a8; }
  /* a card with alt arts is one tile with the other arts peeking out behind it */
  .pile { position:relative; isolation:isolate; }
  .pile::before, .pile::after { content:""; position:absolute; inset:0; border-radius:14px; z-index:-1;
                                background:linear-gradient(160deg, #3b3360, #232838); border:2px solid #6a5bb0;
                                box-shadow:0 6px 16px rgba(0,0,0,.45); transition:transform .15s; }
  .pile::before { transform:translate(7px, 3px) rotate(4deg); }
  .pile::after { transform:translate(12px, 6px) rotate(8deg); opacity:.7; }
  .pile.two::after { display:none; }
  .slot:not(.owned) .pile::before, .slot:not(.owned) .pile::after { opacity:.22; box-shadow:none; }
  .slot.owned:hover .pile::before { transform:translate(10px, 0) rotate(6deg); }
  .slot.owned:hover .pile::after { transform:translate(17px, 1px) rotate(11deg); }
  .marts { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .marts .lab { color:var(--dim); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-right:2px; }
  .art { border-radius:99px; padding:5px 12px; font-size:13px; font-weight:800; background:#2c2250; color:#e4daff;
         border:1px solid #5d46a8; outline:2px solid transparent; outline-offset:2px; }
  .art.z { background:#1b1f2b; color:#6d7488; border-color:#2a2f3d; }
  .art.sel { outline-color:#fff; }
  .art:focus-visible { outline-color:var(--acc); }

  /* leaderboard */
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:#1e2230; }
  td.rk { color:var(--dim); width:50px; }
  td a { text-decoration:none; font-weight:700; }
  td a:hover { color:var(--h); }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
  .updated { color:var(--dim); font-size:12px; margin:-6px 0 14px; }

  /* showcase (!showcase): up to 5 favourite cards above the grid */
  .showcase { margin:0 0 26px; padding:14px 18px 18px; border-radius:16px; border:1px solid #4a3d7a;
              background:linear-gradient(160deg, #221d36, #161922 70%); }
  .showcase h2 { margin:0 0 12px; font-size:24px; }
  .scrow { display:flex; flex-wrap:wrap; justify-content:center; gap:18px; }
  .scrow .slot { width:calc((100% - 4 * 18px) / 5); }
  .scrow .meta .nm { min-width:0; }
  .scempty { color:var(--dim); font-size:14px; margin:-14px 0 22px; }
  .scempty b { color:var(--text); }
  .mbox:has(.scbtn) { --room-sc:50px; }
  .mbox:has(.tbbtn) { --room-sc:96px; }   /* the trade button wraps under the showcase one */
  .scbtn { background:#2c2250; color:#e4daff; border:1px solid #5d46a8; border-radius:99px; padding:7px 16px; font-size:14px; }
  .scbtn:hover:not(:disabled) { background:#3a2d6b; }
  .scbtn.on { background:linear-gradient(135deg, #b8860b, #e8b923); color:#241800; border-color:#e8b923; }
  .scbtn:disabled { opacity:.5; cursor:default; }
  .scbar { position:fixed; z-index:40; left:50%; bottom:14px; transform:translateX(-50%); width:min(760px, calc(100% - 24px));
           display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; padding:12px 14px; border-radius:14px;
           background:#1d1a2e; border:1px solid #5d46a8; box-shadow:0 10px 30px rgba(0,0,0,.6); }
  .scbar .lab { flex:1 1 100%; color:var(--dim); font-size:13px; }
  .scbar code { flex:1 1 220px; min-width:0; overflow-wrap:anywhere; font:14px/1.4 ui-monospace, Consolas, monospace;
                background:#0f1117; border:1px solid var(--line); border-radius:8px; padding:8px 10px; user-select:all; }
  .scbar .undo { background:none; border:1px solid var(--line); color:var(--dim); }
  body.has-scbar .wrap { padding-bottom:170px; }
  /* trade box: built by hand across two collection pages, gives the !trade line to paste in chat */
  .mbtns { display:flex; flex-wrap:wrap; gap:8px; }
  .tbbtn { background:#173236; color:#cdf3ef; border:1px solid #2f7f78; border-radius:99px; padding:7px 16px; font-size:14px; }
  .tbbtn:hover:not(:disabled) { background:#1f4448; }
  .tbbtn:disabled { opacity:.55; cursor:default; }
  .tradebox { margin:0 0 22px; padding:14px 16px; border-radius:14px; border:1px solid #2f7f78;
              background:linear-gradient(160deg, #15292c, #161922 70%); }
  .tbhead { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .tbhead h2 { margin:0; font-size:20px; flex:1; }
  .tbhead button { background:none; border:1px solid var(--line); color:var(--dim); padding:5px 12px; font-size:13px; }
  .tbcols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .tbcols h3 { margin:0 0 6px; font-size:14px; color:var(--dim); font-weight:600; }
  .tbcols h3 a { color:var(--text); font-weight:800; text-decoration:none; }
  .tbchips { display:flex; flex-wrap:wrap; gap:6px; }
  .tbchip { display:inline-flex; align-items:center; gap:6px; background:#1e2230; border:1px solid var(--line); border-radius:8px;
            padding:4px 4px 4px 9px; font-size:13px; }
  .tbchip b { font-family:ui-monospace, Consolas, monospace; font-weight:700; }
  .tbchip span { color:var(--dim); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tbchip button { background:none; color:var(--dim); padding:2px 7px; font-size:13px; }
  .tbchip button:hover { color:var(--text); }
  .tbwait { color:var(--dim); font-size:13px; line-height:1.45; }
  .tbcmds { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:8px; }
  .tbline { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-size:13px; color:var(--dim); }
  .tbline code { flex:1 1 260px; min-width:0; overflow-wrap:anywhere; font:14px/1.4 ui-monospace, Consolas, monospace; color:var(--text);
                 background:#0f1117; border:1px solid var(--line); border-radius:8px; padding:7px 10px; user-select:all; }
  .tbline button { padding:6px 12px; font-size:13px; }
  @media (max-width:560px) {
    .tbcols { grid-template-columns:1fr; }
    .showcase { padding:12px 12px 14px; }
    .scrow { gap:14px 12px; }
    .scrow .slot { width:calc((100% - 2 * 12px) / 3); }
    .scbar code { flex-basis:100%; }
  }
</style>
<link rel="stylesheet" href="shared/effects.css">
<link rel="stylesheet" href="shared/cardtext.css">
<script src="shared/cardtext.js"></script>
<script src="shared/effects.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="/collection">← All collectors</a>
    <form class="find" id="find"><input id="q" placeholder="Twitch username" autocomplete="off" aria-label="Twitch username"><button>Look up</button></form>
  </div>
  <div class="updated" id="updated" hidden></div>
  <div id="app"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// The collection website (cardbot/publish.py) is a copy of this page on GitHub Pages with no bot behind it:
// each /api/... answer is a file next to the page (api/leaderboard.json, api/collection/<login>.json ...),
// and a viewer's page is ./?u=<login> instead of /collection/<login>. Plugin add-ons fetch /api/ too, so
// fetch itself is pointed at the files.
const STATIC = !!window.CARDS_STATIC;
if (STATIC) {
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => typeof url === "string" && url.startsWith("/api/")
    ? realFetch("api/" + url.slice(5) + ".json", { cache: "no-cache", ...opts })
    : realFetch(url, opts);
}
const userURL = l => STATIC ? "./?u=" + encodeURIComponent(l) : "/collection/" + encodeURIComponent(l);
const parts = location.pathname.replace(/\/+$/, "").split("/");
const login = STATIC ? (new URLSearchParams(location.search).get("u") || "").trim().replace(/^@/, "").toLowerCase() || null
                     : parts[2] ? decodeURIComponent(parts[2]) : null;
if (STATIC) document.querySelector(".home").href = "./";

$("find").onsubmit = e => {
  e.preventDefault();
  const v = $("q").value.trim().replace(/^@/, "").toLowerCase();
  if (v) location.href = userURL(v);
};

// "Updated 4 minutes ago" on the website, so nobody wonders why a card they just opened isn't there yet
async function showUpdated() {
  try {
    const d = await (await fetch("/api/updated")).json();
    EVERY = d.every_minutes || 10;
    const mins = Math.max(0, Math.round((Date.now() - Date.parse(d.at)) / 60000));
    const ago = mins < 1 ? "just now" : mins < 90 ? `${mins} minute${mins === 1 ? "" : "s"} ago`
              : mins < 48 * 60 ? `${Math.round(mins / 60)} hours ago` : `${Math.round(mins / 1440)} days ago`;
    $("updated").textContent = `Updated ${ago}. New cards show up here within about ${d.every_minutes || 10} minutes.`;
    $("updated").hidden = false;
  } catch {}
}
let EVERY = 10;
if (STATIC) showUpdated();

function frameClass(c) { return c.H > 0 ? "H" : c.R > 0 ? "R" : "C"; }

// Use art/back.png as the card back if it exists (same file the stream overlay uses).
const backImg = new Image();
backImg.onload = () => {
  document.documentElement.style.setProperty("--back-img", `url(${backImg.src})`);
  document.documentElement.classList.add("custom-back");
};
fetch("/api/back").then(r => r.json()).then(d => { if (d.url) backImg.src = d.url; }).catch(() => {});

function faceHTML(c, r) {
  const hue = (parseInt(c.id, 10) * 47 + (c.id.charCodeAt(4) - 65) * 23) % 360;
  const bdr = c.border ? `<img class="bdr" src="${esc(c.border)}" alt="">` : "";   // art/border-<letter>.png
  return (c.image
    ? `<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy">`
    : `<div class="ph${c.hide_name ? "" : " tx"}" style="--hue:${hue}"><div class="n">#${esc(c.id)}</div>${c.hide_name ? `<div class="t">${esc(c.name)}</div>` : ""}</div>`) + bdr + CardText.html(c, r);
}

// One tile per card number. Every border version of a card (0001A, 0001B...) is grouped under it.
const RORDER = ["H", "R", "C"];
function group(list) {
  const m = new Map();
  for (const c of list) {
    const n = c.id.slice(0, 4);
    if (!m.has(n)) m.set(n, { num: n, vs: [] });
    m.get(n).vs.push(c);
  }
  return [...m.values()].map(g => {
    g.vs.sort((a, b) => a.border_weight - b.border_weight || a.id.localeCompare(b.id));   // rarest border first
    const own = g.vs.filter(v => v.owned);
    g.owned = own.length > 0;
    g.name = own.length ? own[0].name : null;
    g.rarities = [...new Set(g.vs.flatMap(v => v.rarities))];
    g.limited = g.vs.some(v => Object.keys(v.limits || {}).length > 0);
    g.retired = g.vs.some(v => v.retired);
    g.alt_of = g.vs[0].alt_of; g.alt_of_name = g.vs[0].alt_of_name; g.alts = g.vs[0].alts || [];
    return g;
  });
}
// every version of a card, best first: Holo (rarest border first), then Rare, then Common
function combos(g) {
  const out = [];
  for (const r of RORDER) for (const v of g.vs) if (v.rarities.includes(r) || v[r] > 0) out.push({ v, r });
  return out;
}
const bestCombo = g => combos(g).find(x => x.v[x.r] > 0);

// Alt arts stack with their base card: one tile per stack, and the pop-up flips between the arts.
// (Counting doesn't change: every alt is still its own card in "Cards found".)
// separate: "Alt arts: Separate", every alt is its own tile (a stack of one) in number order.
function stacks(G, P, separate) {
  const byNum = new Map(G.concat(P).map(g => [g.num, g])), out = new Map();
  for (const g of G.concat(P)) {
    const root = !separate && g.alt_of && byNum.has(g.alt_of) ? g.alt_of : g.num;   // base not shown here: the alt stands alone
    if (!out.has(root)) out.set(root, { num: root, arts: [] });
    out.get(root).arts.push(g);
  }
  const mk = list => list.filter(g => out.has(g.num)).map(g => {
    const s = out.get(g.num);
    s.arts.sort((a, b) => (b.num === s.num) - (a.num === s.num) || a.num.localeCompare(b.num));   // base first
    s.owned = s.arts.some(a => a.owned);
    s.limited = s.arts.some(a => a.limited);
    return s;
  });
  return [mk(G), mk(P)];
}
// the art to show first: the one holding your best version (Holo beats Rare beats Common), base card on a tie
function bestArt(s) {
  let best = -1, score = 9;
  s.arts.forEach((a, i) => { const b = a.owned && bestCombo(a); if (b && RORDER.indexOf(b.r) < score) { score = RORDER.indexOf(b.r); best = i; } });
  return Math.max(best, 0);
}
const sumR = (g, k) => g.vs.reduce((n, v) => n + v[k], 0);

// "ALT of #0001" on an alt version, "ALT ART" on a card that has one (promo alts stay hidden until you own one)
function altPill(g) {
  if (g.alt_of) return `<span class="altpill" title="Alternate art of #${esc(g.alt_of)}${g.alt_of_name ? " " + esc(g.alt_of_name) : ""}">ALT of #${esc(g.alt_of)}</span>`;
  if (g.alts.length) return `<span class="altpill has" title="Has an alternate art version">ALT ART</span>`;
  return "";
}
const retPill = g => g.retired ? `<span class="altpill ret" title="Retired: this card isn't pulled any more. Only the people who got one have it.">RETIRED</span>` : "";
const ltdPill = g => g.limited ? `<span class="altpill ltd" title="At least one version is a limited edition">LIMITED</span>` : "";

function tile(s) {
  const n = s.arts.length, g = s.arts[bestArt(s)];
  const arts = n > 1 ? `<span class="altpill has" title="${n} different arts of this card. Open it to flip between them.">${n} ARTS</span>` : altPill(g);
  const pile = h => n > 1 ? `<div class="pile${n === 2 ? " two" : ""}">${h}</div>` : h;
  if (!s.owned) {
    // someone else's pull of this card (base art first, rarest border first): only shown with "Show missing cards" on
    const seen = s.arts.flatMap(a => a.vs).find(v => v.seen_image);
    const ghost = seen ? `<div class="frame ghost"><div class="face"><img src="${esc(seen.seen_image)}" alt="" loading="lazy">${
      seen.seen_border ? `<img class="bdr" src="${esc(seen.seen_border)}" alt="" loading="lazy">` : ""}</div></div>` : "";
    return `<div class="slot" data-num="${esc(s.num)}">${pile(`${ghost}<div class="frame none"><div class="backface"></div></div>`)}
            <div class="meta"><span class="nm" style="color:#4a5164">#${esc(s.num)} · Not found yet</span>${arts}${ltdPill(s)}</div></div>`;
  }
  const b = bestCombo(g), c = b.v;     // the tile shows the best version you own
  const face = faceHTML(c, b.r);
  const sum = k => s.arts.reduce((t, a) => t + sumR(a, k), 0), has = k => s.arts.some(a => a.rarities.includes(k)) || sum(k);
  const pill = (k, x) => `<span class="pill ${x ? k : "z"}" title="${{H:"Holo",R:"Rare",C:"Common"}[k]}">${k} ${x}</span>`;
  return `<div class="slot owned" data-id="${esc(s.num)}" data-num="${esc(s.num)}" tabindex="0" role="button" aria-label="View ${esc(g.name)} larger">${pile(`<div class="frame ${b.r}"><div class="face" data-fx="${b.r}">${face}</div></div>`)}
          <div class="meta">${arts}${ltdPill(s)}${retPill(g)}<span class="pills">${RORDER.filter(has).map(k => pill(k, sum(k))).join("")}</span></div></div>`;
}

async function showUser() {
  const r = await fetch("/api/collection/" + encodeURIComponent(login));
  if (!r.ok) {
    document.title = "Not found";
    $("app").innerHTML = `<h1>${esc(login)}</h1><div class="empty">No collection yet — they haven't opened a card${STATIC ? " (or only just did)" : ""}, or the name is spelled differently.</div>`;
    return;
  }
  const d = await r.json();
  const G = group(d.cards), P = group(d.promos), multi = G.some(g => g.vs.length > 1);
  CARDS = G.concat(P);
  document.title = `${d.name}'s cards`;
  const holos = d.cards.reduce((n, c) => n + c.H, 0);
  const pct = d.of ? Math.round(d.unique / d.of * 100) : 0;
  $("app").innerHTML = `
    <h1>${esc(d.name)}'s collection</h1>
    <div class="sub">Frame colour shows the best version you own: silver common, gold rare, rainbow holo.</div>
    <div class="stats">
      <div class="stat"><b>${G.filter(g => g.owned).length} / ${G.length}</b><span>Cards found</span></div>
      ${multi ? `<div class="stat"><b>${d.unique} / ${d.of}</b><span>Border versions</span></div>` : ""}
      <div class="stat"><b>${d.total}</b><span>Total cards</span></div>
      <div class="stat"><b>${holos}</b><span>Holos</span></div>
    </div>
    <div class="bar" title="${pct}% complete"><i style="width:${pct}%"></i></div>
    <div id="tradebox"></div>
    <div id="showcase"></div>
    <div class="finder"><input id="find-cards" type="search" placeholder="Search: a name, a number, a source like FFX…" autocomplete="off" aria-label="Search the cards">
      <span class="count" id="find-count"></span><button class="clear" id="find-clear" hidden>Clear</button></div>
    <div class="views" id="views"></div>
    <div id="addons-top"></div>
    <div id="grids"></div>`;
  SC = { name: d.name, slots: d.showcase_slots || 5, saved: (d.showcase || []).map(x => x.id + x.r) };
  SC.picks = SC.saved.slice();
  drawShowcase(d);
  PAGE = { login: d.login, name: d.name };
  tbLoad(); drawTrade();
  views(G, P);
  $("find-cards").oninput = applySearch;
  $("find-clear").onclick = () => { $("find-cards").value = ""; applySearch(); $("find-cards").focus(); };
  ADDONS.forEach(a => a.onUser && a.onUser(d));
}

// The switches above the grid, remembered on this browser:
//   Not found: Card backs / Grey (someone else's pull in greyscale, only when there is one) / Hide (no gaps)
//   Alt arts: Stacked (one tile per main card) / Separate (only when there are alts)
function views(G, P) {
  const get = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const anyGrey = G.concat(P).some(g => !g.owned && g.vs.some(v => v.seen_image));
  const anyAlts = G.concat(P).some(g => g.alt_of);
  let miss = get("missing", get("showMissing") === "1" ? "grey" : "back");   // showMissing: the V4.23 button
  if (miss === "grey" && !anyGrey) miss = "back";
  let alts = get("altArts", "stacked");
  const seg = (id, label, cur, opts) => `<div class="seg" id="${id}"><span>${label}</span><span class="opts">${
    opts.map(([v, t, tip]) => `<button data-v="${v}" aria-pressed="${v === cur}" title="${tip}">${t}</button>`).join("")}</span></div>`;
  const draw = () => {
    $("views").innerHTML = seg("v-miss", "Not found:", miss, [
        ["back", "Card backs", "Cards you haven't found show as a card back"],
        ...(anyGrey ? [["grey", "Grey", "Cards you haven't found that somebody in the channel has, in grey"]] : []),
        ["hide", "Hide", "Only show the cards you've found, with no gaps"]])
      + (anyAlts ? seg("v-alts", "Alt arts:", alts, [
        ["stacked", "Stacked", "Alt arts share their main card's tile"],
        ["separate", "Separate", "Every alt art gets its own tile"]]) : "");
    $("app").classList.toggle("show-missing", miss === "grey");
    $("app").classList.toggle("hide-missing", miss === "hide");
    const [GS, PS] = stacks(G, P, anyAlts && alts === "separate");
    STACKS = GS.concat(PS);
    $("grids").innerHTML = `<div class="grid fx-still">${GS.map(tile).join("")}</div>
      ${PS.length ? `<div class="${PS.some(s => s.owned) ? "" : "no-promos"}"><h2>Promos</h2><div class="grid fx-still">${PS.map(tile).join("")}</div></div>` : ""}`;
    CardFX.attach($("grids"), { still: true });   // a redraw makes new faces: their holo/rare layers again
    applySearch();
    $("views").querySelectorAll("#v-miss button").forEach(b => b.onclick = () => { miss = b.dataset.v; put("missing", miss); draw(); });
    $("views").querySelectorAll("#v-alts button").forEach(b => b.onclick = () => { alts = b.dataset.v; put("altArts", alts); draw(); });
  };
  draw();
}

// ---------- search ----------
// Matches a card's number, and for cards you've found its name, source and series. Cards you haven't found only match
// by number: their name and source stay hidden, like everywhere else on the page. Every word typed has to match.
// A source or series also matches its initials, so "ffx" finds Final Fantasy X and "kh2" Kingdom Hearts 2. A number at
// the end stays whole: "ffx" is FFX only, never FFXIV, and "ff" finds every Final Fantasy. Roman numerals also match as
// plain numbers, so "ff7" finds Final Fantasy VII.
const NUMERAL = /^(\d+|x{0,3}(ix|iv|v?i{0,3}))$/;          // 2, 10, x, iv, xiv... (not words like "mix")
function initials(text) {
  const w = String(text || "").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  if (w.length < 2) return null;
  const last = w[w.length - 1], num = NUMERAL.test(last) ? last : "";
  return [(num ? w.slice(0, -1) : w).map(x => x[0]).join(""), num, /^\d/.test(num) ? "" : String(roman(num) || "")];
}
function roman(r) {
  const v = { i: 1, v: 5, x: 10 };
  let n = 0;
  for (let k = 0; k < r.length; k++) n += v[r[k]] < (v[r[k + 1]] || 0) ? -v[r[k]] : v[r[k]];
  return n;
}
function searchIndex(s) {
  const bits = [], abbr = [];
  for (const a of s.arts) {
    bits.push(a.num, String(+a.num));
    for (const v of a.vs) if (v.owned) {
      bits.push(v.name, v.source, v.series);
      for (const t of [v.source, v.series]) { const i = initials(t); if (i) abbr.push(i); }
    }
  }
  return { text: bits.filter(Boolean).join(" | ").toLowerCase(), abbr };
}
let QUERY = [];
const hit = (ix, t) => ix.text.includes(t) || ix.abbr.some(([l, n, d]) => t === l + n || (d && t === l + d) || l.startsWith(t));
const matches = s => QUERY.every(t => hit(s._find ??= searchIndex(s), t));
function applySearch() {
  const box = $("find-cards"); if (!box) return;
  QUERY = box.value.toLowerCase().split(/\s+/).filter(Boolean);
  $("find-clear").hidden = !QUERY.length;
  const byNum = new Map(STACKS.map(s => [s.num, s]));
  let hits = 0;
  $("grids").querySelectorAll(".slot[data-num]").forEach(el => {
    const s = byNum.get(el.dataset.num), ok = !s || matches(s);
    el.classList.toggle("nomatch", !ok);
    if (ok && s) hits++;
  });
  $("grids").querySelectorAll(".grid").forEach(g => {       // the Promos heading goes when none of them match
    const wrap = g.parentElement !== $("grids") ? g.parentElement : null;
    if (wrap) wrap.classList.toggle("nomatch", !!QUERY.length && !g.querySelector(".slot:not(.nomatch)"));
  });
  let none = $("find-none");
  if (QUERY.length && !hits) {
    if (!none) { none = document.createElement("div"); none.id = "find-none"; none.className = "nohits"; $("grids").prepend(none); }
    none.textContent = `No cards match "${box.value.trim()}". Cards you haven't found only match by number.`;
  } else if (none) none.remove();
  $("find-count").textContent = QUERY.length ? `${hits} card${hits === 1 ? "" : "s"}` : "";
}

// ---------- showcase ----------
// The row shows what's saved (set in chat with !showcase). The ★ button on an enlarged card picks cards on this page
// only: the bar at the bottom then gives the chat command that saves them (the website can't save anything itself).
let SC = { name: "", slots: 5, saved: [], picks: [] };
function drawShowcase(d) {
  const all = new Map(d.cards.concat(d.promos).map(c => [c.id, c]));
  const items = (d.showcase || []).map(x => ({ v: all.get(x.id), r: x.r })).filter(x => x.v && x.v[x.r] > 0);
  if (!items.length) {
    $("showcase").innerHTML = `<div class="scempty">★ No showcase yet. Open a card and press <b>Add to showcase</b>, or type <b>!showcase 0153AC</b> in chat to put up to ${SC.slots} favourites here.</div>`;
    return;
  }
  $("showcase").innerHTML = `<div class="showcase"><h2>★ Showcase</h2><div class="scrow">${items.map(({ v, r }) => `
    <div class="slot owned" data-id="${esc(v.id.slice(0, 4))}" data-v="${esc(v.id)}" data-r="${r}" tabindex="0" role="button" aria-label="View ${esc(v.name)} larger">
      <div class="frame ${r}"><div class="face" data-fx="${r}">${faceHTML(v, r)}</div></div>
      <div class="meta"><span class="nm" title="${esc(v.name)}">${esc(v.name)}</span><span class="pill ${r}" title="Serial">${esc(v.id + r)}</span></div>
    </div>`).join("")}</div></div>`;
}
function scToggle(serial) {
  const i = SC.picks.indexOf(serial);
  if (i >= 0) SC.picks.splice(i, 1);
  else if (SC.picks.length < SC.slots) SC.picks.push(serial);
  drawBar();
}
function drawBar() {
  let bar = $("scbar");
  const changed = SC.picks.join(" ") !== SC.saved.join(" ");
  document.body.classList.toggle("has-scbar", changed);
  if (!changed) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement("div"); bar.id = "scbar"; bar.className = "scbar"; document.body.appendChild(bar); }
  const cmd = SC.picks.length ? "!showcase " + SC.picks.join(" ") : "!showcase clear";
  bar.innerHTML = `<div class="lab">★ Showcase ${SC.picks.length} / ${SC.slots}. To save it, ${esc(SC.name)} types this in Twitch chat${
      STATIC ? ` (the website shows it within about ${EVERY} minutes)` : ""}:</div>
    <code>${esc(cmd)}</code><button class="copy">Copy</button><button class="undo">Undo</button>`;
  bar.querySelector(".copy").onclick = async e => {
    try { await navigator.clipboard.writeText(cmd); e.target.textContent = "Copied!"; }
    catch { getSelection().selectAllChildren(bar.querySelector("code")); e.target.textContent = "Press Ctrl+C"; }
  };
  bar.querySelector(".undo").onclick = () => { SC.picks = SC.saved.slice(); drawBar(); if ($("modal")) renderCard(); };
}
function scButton(serial) {
  const on = SC.picks.includes(serial), full = !on && SC.picks.length >= SC.slots;
  return `<button class="scbtn${on ? " on" : ""}" data-s="${esc(serial)}"${full ? " disabled" : ""} title="${
    on ? "Take it out of the showcase" : full ? `The showcase holds ${SC.slots} cards: take one out first` : "Put this version at the top of the page"}">★ ${
    on ? "In showcase" : full ? "Showcase full" : "Add to showcase"} (${SC.picks.length}/${SC.slots})</button>`;
}

// ---------- trade box ----------
// Built by hand: "Add to trade" on one person's cards, then on the other person's page (either order). The box is
// kept on this browser, so it follows you from page to page, and once both sides have cards it gives the !trade line
// to paste in chat. Nothing is checked or sent from here: !trade checks everything when it's typed and accepted.
const TRADE_MAX = 10;                       // game.MAX_TRADE_ITEMS: different serials a side
let TB = { sides: [] }, PAGE = null;        // sides: [{login, name, items: [{s: serial, name, n}]}], at most 2
function tbLoad() {
  try { const t = JSON.parse(localStorage.getItem("trade-box") || "null"); TB = t && Array.isArray(t.sides) ? t : { sides: [] }; }
  catch { TB = { sides: [] }; }
}
function tbSave() { try { localStorage.setItem("trade-box", JSON.stringify(TB)); } catch {} drawTrade(); }
addEventListener("storage", e => {          // the same box changed in another tab
  if (e.key === "trade-box" && PAGE) { tbLoad(); drawTrade(); if ($("modal")) renderCard(); }
});
const tbSide = l => TB.sides.find(x => x.login === l);
function tbState(v, r) {
  const side = tbSide(PAGE.login), it = side && side.items.find(i => i.s === v.id + r), n = it ? it.n : 0;
  if (!side && TB.sides.length >= 2) return { label: `Trade is between ${TB.sides[0].name} and ${TB.sides[1].name}: clear it first`, off: true };
  if (n >= v[r]) return { label: `In trade ×${n}`, off: true };
  const other = TB.sides.find(x => x.login !== PAGE.login && x.items.some(i => i.s === v.id + r));
  if (other) return { label: `${other.name} is already giving ${v.id + r}`, off: true };   // !trade refuses the same card on both sides
  if (!it && side && side.items.length >= TRADE_MAX) return { label: `Trade full (${TRADE_MAX} cards a side)`, off: true };
  return { label: n ? `Add another (${n} in trade)` : "Add to trade", off: false };
}
function trButton(v, r) {
  if (!PAGE || v.tradable === false) return "";      // promos only when they're tradable, like !trade
  const st = tbState(v, r);
  return `<button class="tbbtn"${st.off ? " disabled" : ""} title="Put this card in the trade box at the top of the page">⇄ ${esc(st.label)}</button>`;
}
function tbAdd(v, r) {
  if (tbState(v, r).off) return;
  let side = tbSide(PAGE.login);
  if (!side) { side = { login: PAGE.login, name: PAGE.name, items: [] }; TB.sides.push(side); }
  const it = side.items.find(i => i.s === v.id + r);
  if (it) it.n++; else side.items.push({ s: v.id + r, name: v.name || "#" + v.id.slice(0, 4), n: 1 });
  tbSave();
}
function tbTake(login, serial) {
  const side = tbSide(login); if (!side) return;
  const it = side.items.find(i => i.s === serial); if (!it) return;
  if (--it.n <= 0) side.items.splice(side.items.indexOf(it), 1);
  if (!side.items.length) TB.sides.splice(TB.sides.indexOf(side), 1);
  tbSave();
  if ($("modal")) renderCard();
}
const tbList = side => side.items.map(i => i.s + (i.n > 1 ? " x" + i.n : "")).join(" ");
function drawTrade() {
  const el = $("tradebox"); if (!el) return;
  if (!TB.sides.length) { el.innerHTML = ""; return; }
  const [a, b] = TB.sides;
  const col = side => `<div><h3><a href="${esc(userURL(side.login))}">${esc(side.name)}</a> gives</h3><div class="tbchips">${side.items.map(i =>
      `<span class="tbchip"><b>${esc(i.s)}</b><span title="${esc(i.name)}">${esc(i.name)}</span>${i.n > 1 ? `×${i.n}` : ""}<button data-l="${esc(side.login)}" data-s="${esc(i.s)}" aria-label="Take one ${esc(i.s)} out">✕</button></span>`).join("")}</div></div>`;
  const wait = `<div><h3>Who's ${esc(a.name)} trading with?</h3><div class="tbwait">Open the other person's collection page
      (<a href="${STATIC ? "./" : "/collection"}">all collections</a>), click a card and press <b>⇄ Add to trade</b>.</div></div>`;
  const line = (x, y) => { const cmd = `!trade ${tbList(x)} @${y.login} ${tbList(y)}`;
    return `<div class="tbline">If you're ${esc(x.name)}, type in Twitch chat: <code>${esc(cmd)}</code><button data-copy="${esc(cmd)}">Copy</button></div>`; };
  el.innerHTML = `<div class="tradebox"><div class="tbhead"><h2>⇄ Trade</h2><button id="tbclear">Clear</button></div>
    <div class="tbcols">${col(a)}${b ? col(b) : wait}</div>
    ${b ? `<div class="tbcmds">${line(a, b)}${line(b, a)}<div class="tbwait">Then the other person types <b>!trade accept</b>. Nothing moves until they do, and only if both still have the cards.</div></div>` : ""}</div>`;
  el.querySelectorAll(".tbchip button").forEach(x => x.onclick = () => tbTake(x.dataset.l, x.dataset.s));
  $("tbclear").onclick = () => { TB = { sides: [] }; tbSave(); if ($("modal")) renderCard(); };
  el.querySelectorAll("[data-copy]").forEach(x => x.onclick = async () => {
    try { await navigator.clipboard.writeText(x.dataset.copy); x.textContent = "Copied!"; }
    catch { getSelection().selectAllChildren(x.previousElementSibling); x.textContent = "Press Ctrl+C"; }
    setTimeout(() => x.textContent = "Copy", 1500);
  });
}

// ---------- enlarge a card ----------
let CARDS = [], STACKS = [], OWNED = [], cur = -1, art = 0, selV = "", selR = "C", lastFocus = null;
const RNAME = { H: "Holo", R: "Rare", C: "Common" };
const curArt = () => OWNED[cur].arts[art];

function pickVersion() { const g = curArt(), b = bestCombo(g) || combos(g)[0]; if (b) { selV = b.v.id; selR = b.r; } }
function pickBest() { art = bestArt(OWNED[cur]); pickVersion(); }

// pick: {v, r} opens that exact version (a showcase tile), even an alt art inside a stack
function openCard(num, pick) {
  OWNED = STACKS.filter(s => s.owned && matches(s));            // ← → step through what the search shows
  if (!OWNED.some(g => g.num === num || g.arts.some(a => a.num === num))) OWNED = STACKS.filter(s => s.owned);
  cur = OWNED.findIndex(g => g.num === num);
  if (cur < 0 && pick) cur = OWNED.findIndex(g => g.arts.some(a => a.num === num));
  if (cur < 0) return;
  pickBest();
  if (pick) {
    const i = OWNED[cur].arts.findIndex(a => a.num === num);
    if (i >= 0) { art = i; selV = pick.v; selR = pick.r; }
  }
  lastFocus = document.activeElement;
  document.body.classList.add("modal-open");
  const m = document.createElement("div");
  m.className = "mback"; m.id = "modal";
  m.onclick = e => { if (e.target === m) closeCard(); };
  document.body.appendChild(m);
  renderCard();
}

function altNote(g) {
  const bits = [];
  if (g.alt_of) bits.push(`Alternate art of #${esc(g.alt_of)}${g.alt_of_name ? " " + esc(g.alt_of_name) : ""}`);
  if (g.alts.length) bits.push("Alternate art: " + g.alts.map(a => "#" + esc(a.num) + (a.name ? " " + esc(a.name) : "")).join(", "));
  return bits.length ? `<div style="margin-top:6px;color:#cdbbff">${bits.join(" · ")}</div>` : "";
}

function renderCard(focus) {
  const s = OWNED[cur], g = curArt(), m = $("modal"), multi = OWNED.length > 1, na = s.arts.length;
  const cs = combos(g), sel = cs.find(x => x.v.id === selV && x.r === selR) || bestCombo(g) || cs[0];
  const title = g.name || s.arts[bestArt(s)].name;
  const v = sel.v, r = sel.r, have = v[r] > 0, nb = g.vs.length;
  const facts = [`#${esc(g.num)}${nb > 1 ? " · " + esc(v.border_name) : ""} · ${RNAME[r]}`,
                 g.owned && v.source ? `Source <b>${esc(v.source)}</b>` : "",
                 g.owned && v.series ? `Series <b>${esc(v.series)}</b>` : ""].filter(Boolean);
  const info = `<div class="minfo"><div class="mname">${g.owned ? esc(title) : "Not found yet"}</div>
      <div class="mfacts">${facts.join("<br>")}</div></div>`;
  const lbl = (x, n) => (nb > 1 ? `${x.v.border_name} ` : "") + `${RNAME[x.r]} ×${n}`;
  const tab = x => `<button class="tab ${x.v[x.r] ? x.r : "z"}${x === sel ? " sel" : ""}" role="tab" aria-selected="${x === sel}" data-v="${esc(x.v.id)}" data-r="${x.r}" title="${esc(x.v.border_name)} ${RNAME[x.r]}">${esc(lbl(x, x.v[x.r]))}</button>`;
  // with several borders the versions stack in a grid: a row per rarity (best on top), a column per border
  const cells = nb > 1
    ? RORDER.filter(k => g.rarities.includes(k) || sumR(g, k)).flatMap(k => g.vs.map(w => cs.find(x => x.v === w && x.r === k)))
        .map(x => x ? tab(x) : "<span></span>").join("")
    : cs.map(tab).join("");
  const hint = [multi ? "← → other cards" : "", na > 1 ? "Q E other arts" : "", cs.length > 1 ? "↑ ↓ other versions" : ""].filter(Boolean).join(" · ");
  const arts = na > 1 ? `<div class="marts" role="group" aria-label="Arts"><span class="lab">Art</span>${s.arts.map((a, i) =>
      `<button class="art${a.owned ? "" : " z"}${i === art ? " sel" : ""}" data-a="${i}" aria-pressed="${i === art}" title="#${esc(a.num)}${a.owned ? " " + esc(a.name) : " · not found yet"}">${i + 1}</button>`).join("")}</div>` : "";
  m.innerHTML = `
    <button class="mclose" aria-label="Close">✕</button>
    ${multi ? `<button class="mnav prev" aria-label="Previous card">‹</button><button class="mnav next" aria-label="Next card">›</button>` : ""}
    <div class="mbox${nb > 1 ? " multi" : ""}${na > 1 ? " arts" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="big${v.horizontal ? " side" : ""}">${have
        ? `<div class="frame ${r}"><div class="face" data-fx="${r}">${faceHTML(v, r)}</div></div>`
        : `<div class="frame none"><div class="backface"></div></div>`}</div>
      <div class="mside">
      ${info}
      <div class="mlimit"><span class="ser">Serial <b>${esc(v.id + r)}</b></span>${v.limits && v.limits[r] ? ` · <span class="lim">Limit <b>${v.limits[r]}</b></span> · Found <b>${v.found[r]}</b>${v.found[r] >= v.limits[r] ? " (all claimed)" : ""}` : ""}</div>
      ${have ? `<div class="mbtns">${scButton(v.id + r)}${trButton(v, r)}</div>` : ""}
      ${ADDONS.map(a => a.cardHTML ? a.cardHTML(g, v, r, have) : "").join("")}
      ${arts}
      <div class="mtabs${nb > 1 ? " grid2" : ""}" style="--cols:${nb}" role="tablist" aria-label="Versions">${cells}</div>
      <div class="mnote">${!g.owned ? `You haven't found this art yet (#${esc(g.num)}).`
        : have ? "" : `You haven't found the ${nb > 1 ? esc(v.border_name) + " " : ""}${RNAME[r]} version yet.`}${na > 1 ? "" : altNote(g)}</div>
      <div class="mhint">${hint}</div>
      </div>
    </div>`;
  m.querySelector(".mclose").onclick = closeCard;
  const scb = m.querySelector(".scbtn");
  if (scb) scb.onclick = () => { scToggle(scb.dataset.s); renderCard(".scbtn"); };
  const tbb = m.querySelector(".tbbtn");
  if (tbb) tbb.onclick = () => { tbAdd(v, r); renderCard(".tbbtn"); };
  ADDONS.forEach(a => a.bindCard && a.bindCard(m, g, v, r));
  if (multi) {
    m.querySelector(".prev").onclick = () => step(-1);
    m.querySelector(".next").onclick = () => step(1);
  }
  m.querySelectorAll(".tab").forEach(b => b.onclick = () => { selV = b.dataset.v; selR = b.dataset.r; renderCard(".tab.sel"); });
  m.querySelectorAll(".art").forEach(b => b.onclick = () => { art = +b.dataset.a; pickVersion(); renderCard(".art.sel"); });
  CardFX.attach(m);
  const big = m.querySelector(".big"), fr = big.querySelector(".frame"), face = big.querySelector(".face");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    big.onpointermove = e => {            // gentle 3D tilt; holo foil follows the pointer
      const rc = big.getBoundingClientRect();
      const x = (e.clientX - rc.left) / rc.width, y = (e.clientY - rc.top) / rc.height;
      if (v.horizontal) {                 // the card is turned clockwise: its own across is down the screen
        fr.style.transform = `rotateX(${(x - .5) * 14}deg) rotateY(${(y - .5) * 14}deg)`;
        if (face) CardFX.live(face, y, 1 - x);
        return;
      }
      fr.style.transform = `rotateY(${(x - .5) * 14}deg) rotateX(${-(y - .5) * 14}deg)`;
      if (face) CardFX.live(face, x, y);
    };
    big.onpointerleave = () => { fr.style.transform = ""; if (face) CardFX.live(face, null); };
  }
  (focus && m.querySelector(focus) || m.querySelector(".mclose")).focus();
}

function step(d) { cur = (cur + d + OWNED.length) % OWNED.length; pickBest(); renderCard(); }

function stepArt(d) {
  const n = OWNED[cur].arts.length;
  if (n < 2) return;
  art = (art + d + n) % n; pickVersion(); renderCard(".art.sel");
}

function stepVersion(d) {
  const cs = combos(curArt());
  if (cs.length < 2) return;
  const i = cs.findIndex(x => x.v.id === selV && x.r === selR);
  const n = cs[(i + d + cs.length) % cs.length];
  selV = n.v.id; selR = n.r;
  renderCard(".tab.sel");
}

function closeCard() {
  const m = $("modal"); if (!m) return;
  m.remove();
  document.body.classList.remove("modal-open");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

$("app").addEventListener("click", e => {
  const s = e.target.closest(".slot.owned"); if (s) openCard(s.dataset.id, s.dataset.v && { v: s.dataset.v, r: s.dataset.r });
});
$("app").addEventListener("keydown", e => {
  const s = e.target.closest && e.target.closest(".slot.owned");
  if (s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCard(s.dataset.id, s.dataset.v && { v: s.dataset.v, r: s.dataset.r }); }
});
document.addEventListener("keydown", e => {
  const m = $("modal"); if (!m) return;
  if (e.key === "Escape") closeCard();
  else if (e.key === "ArrowLeft" && OWNED.length > 1) step(-1);
  else if (e.key === "ArrowRight" && OWNED.length > 1) step(1);
  else if (e.key === "ArrowUp")   { e.preventDefault(); stepVersion(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); stepVersion(1); }
  else if (e.ctrlKey || e.metaKey || e.altKey) return;            // leave browser shortcuts alone
  else if (e.key === "q" || e.key === "Q" || e.key === "PageUp")   { e.preventDefault(); stepArt(-1); }
  else if (e.key === "e" || e.key === "E" || e.key === "PageDown") { e.preventDefault(); stepArt(1); }
  else if (e.key === "Tab") {               // keep keyboard focus inside the dialog
    const f = [...m.querySelectorAll("button")];
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});

async function showBoard() {
  document.title = "Card Collections";
  const d = await (await fetch("/api/leaderboard")).json();
  if (!d.users.length) { $("app").innerHTML = `<h1>Card collections</h1><div class="empty">Nobody has opened a card yet.</div>`; return; }
  $("app").innerHTML = `<h1>Card collections</h1><div class="sub">Ranked by cards found${d.multi ? " (each border version counts as its own card)" : ""}, then holos, then total cards.</div>
    <table><thead><tr><th>#</th><th>Collector</th><th>Found</th><th>Holos</th><th>Total</th></tr></thead><tbody>
    ${d.users.map((u, i) => `<tr><td class="rk">${i + 1}</td>
      <td><a href="${esc(userURL(u.login))}">${esc(u.display_name)}</a></td>
      <td>${u.unique_cards} / ${u.of ?? d.of}</td><td>${u.holos}</td><td>${u.total_cards}</td></tr>`).join("")}
    </tbody></table>`;
}

// ---------- add-ons (plugins can add things to these pages, e.g. the Quadruple Quartet hand builder) ----------
const ADDONS = [];
window.Collection = { login, esc, $, get cards() { return CARDS; }, add: a => ADDONS.push(a),
                      rerender: () => { if ($("modal")) renderCard(); } };
async function loadAddons() {
  try {
    const f = await (await fetch("/api/features")).json();
    await Promise.all(Object.values(f).filter(x => x && x.collection_js).map(x => new Promise(res => {
      const s = document.createElement("script"); s.src = x.collection_js; s.onload = s.onerror = res; document.head.appendChild(s);
    })));
  } catch {}
}

loadAddons().then(() => login ? showUser().then(() => CardFX.attach($("app"), { still: true })) : showBoard()).catch(() => { $("app").innerHTML = `<div class="empty">${STATIC ? "Couldn't load. Try again in a minute." : "Couldn't load. Is the bot running?"}</div>`; });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<script>window.CARDS_STATIC = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117; --panel:#181b24; --line:#2a2f3d; --text:#e7e9ee; --dim:#8b91a1; --acc:#9147ff;
    --c:#cdd2de; --r:#ffc845; --h:#b98cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 Inter, system-ui, sans-serif; }
  a { color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  .top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .top a.home { text-decoration:none; color:var(--dim); font-weight:700; }
  .top a.home:hover { color:var(--text); }
  form.find { display:flex; gap:8px; }
  input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font:inherit; width:190px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:9px 14px; font:inherit; font-weight:700; cursor:pointer; }

  h1 { font-family:"Lilita One", Impact, sans-serif; font-weight:400; font-size:40px; margin:0 0 4px; line-height:1.1; }
  .sub { color:var(--dim); margin-bottom:18px; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 16px; }
  .stat b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .bar { height:10px; background:var(--panel); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-bottom:26px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg, #9147ff, #4dd2ff); }

  /* grid */
  h2 { font-family:"Lilita One", Impact, sans-serif; font-weight:400; font-size:26px; margin:34px 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px; }
  .slot { display:flex; flex-direction:column; gap:8px; }
  .frame { border-radius:14px; padding:5px; aspect-ratio:5/7; position:relative; box-shadow:0 8px 20px rgba(0,0,0,.4); }
  .frame.C { background:var(--steel); }
  .frame.R { background:var(--r); box-shadow:0 0 18px rgba(255,200,70,.35), 0 8px 20px rgba(0,0,0,.4); }
  .frame.H { background:conic-gradient(from 0deg, #ff6b6b, #ffd93d, #6bff95, #4dd2ff, #b98cff, #ff6b6b);
             box-shadow:0 0 22px rgba(185,140,255,.45), 0 8px 20px rgba(0,0,0,.4); }
  /* cards not found yet show a faded card back (art/back.png if you've added one) */
  .frame.none { background:none; box-shadow:none; padding:0; opacity:.32; filter:saturate(.6); }
  .backface { width:100%; height:100%; border-radius:14px; position:relative; border:6px solid #0e1230;
              background:repeating-conic-gradient(from 45deg at 50% 50%, #1b2350 0 15deg, #222c63 15deg 30deg), #1b2350; }
  .backface::before { content:""; position:absolute; inset:9px; border-radius:8px; border:2px solid rgba(255,255,255,.25); }
  .backface::after { content:""; position:absolute; left:50%; top:50%; width:34%; aspect-ratio:1;
                     transform:translate(-50%,-50%) rotate(45deg); border-radius:8%;
                     background:linear-gradient(135deg, #fff, #9aa8ff); box-shadow:0 0 18px rgba(160,180,255,.8); }
  .custom-back .backface { background:var(--back-img) center / cover no-repeat; border:none; }
  .custom-back .backface::before, .custom-back .backface::after { display:none; }
  .face { width:100%; height:100%; border-radius:10px; overflow:hidden; position:relative; }
  .face img { width:100%; height:100%; object-fit:cover; display:block; }
  .face img.bdr { position:absolute; inset:0; object-fit:fill; pointer-events:none; }
  .ph { height:100%; padding:12px; display:flex; flex-direction:column; justify-content:space-between; color:#fff;
        background:linear-gradient(160deg, hsl(var(--hue) 70% 45%), hsl(calc(var(--hue) + 50) 60% 18%)); }
  .ph .n { font-family:"Lilita One", Impact, sans-serif; font-size:54px; line-height:1; opacity:.92; }
  .ph.tx { justify-content:center; align-items:center; }
  .ph.tx .n { font-size:36px; }
  .big .ph.tx .n { font-size:64px; }
  .ph .t { font-family:"Lilita One", Impact, sans-serif; font-size:20px; line-height:1.1; }
  /* click a card to enlarge it */
  .slot.owned { cursor:zoom-in; }
  .slot.owned .frame { transition:transform .15s; }
  .slot.owned:hover .frame, .slot.owned:focus-visible .frame { transform:translateY(-4px); }
  .slot.owned:focus-visible { outline:2px solid var(--acc); outline-offset:4px; border-radius:16px; }
  body.modal-open { overflow:hidden; }
  .mback { position:fixed; inset:0; z-index:50; background:rgba(5,6,10,.86); display:flex; align-items:center;
           justify-content:center; padding:20px; animation:fade .15s; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .mbox { display:flex; flex-direction:column; align-items:center; gap:16px; max-width:100%; }
  .big { width:min(400px, 82vw, calc((100vh - 230px) * 5 / 7)); perspective:900px; }
  .big .frame { width:100%; border-radius:22px; padding:8px; transition:transform .12s ease-out; will-change:transform; }
  .big .face { border-radius:15px; }
  .big .ph { padding:6%; }
  .big .ph .n { font-size:clamp(60px, 14vw, 110px); }
  .big .ph .t { font-size:clamp(22px, 5vw, 38px); }
  .mname { font-family:"Lilita One", Impact, sans-serif; font-size:30px; line-height:1.1; text-align:center; }
  .mtabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .tab { border:0; border-radius:99px; padding:7px 16px; font:inherit; font-weight:800; font-size:14px; color:#111;
         cursor:pointer; font-variant-numeric:tabular-nums; outline:2px solid transparent; outline-offset:2px; }
  .mtabs.grid2 { display:grid; grid-template-columns:repeat(var(--cols), minmax(0, 1fr)); gap:6px; width:min(400px, 88vw); }
  .mtabs.grid2 .tab { padding:6px 8px; font-size:13px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mbox.multi .big { width:min(400px, 82vw, calc((100vh - 290px) * 5 / 7)); }
  .tab.C { background:var(--c); } .tab.R { background:var(--r); } .tab.H { background:var(--h); }
  .tab.z { background:#232837; color:#7a8296; }
  .tab.sel { outline-color:#fff; }
  .tab:focus-visible { outline-color:var(--acc); }
  .mnote { min-height:20px; color:var(--dim); font-size:14px; text-align:center; }
  .mhint { display:none; color:#5d6579; font-size:12px; }
  @media (hover:hover) { .mhint { display:block; } }
  .big .frame.none { opacity:1; filter:brightness(.55) saturate(.7); border-radius:22px; background:#0b0d14; }
  .mclose, .mnav { position:fixed; background:rgba(255,255,255,.1); color:#fff; border:0; width:44px; height:44px;
                   border-radius:50%; font-size:22px; line-height:1; padding:0; }
  .mclose:hover, .mnav:hover { background:rgba(255,255,255,.22); }
  .mclose { top:16px; right:16px; }
  .mnav { top:50%; transform:translateY(-50%); }
  .mnav.prev { left:16px; } .mnav.next { right:16px; }
  @media (max-width:640px) { .mnav { top:auto; bottom:16px; transform:none; } }
  .meta { display:flex; justify-content:center; align-items:center; gap:6px; min-height:26px; }
  .meta .nm { font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pills { display:flex; gap:4px; flex-shrink:0; }
  .pill { font-size:12px; font-weight:800; padding:2px 7px; border-radius:99px; color:#111; font-variant-numeric:tabular-nums; }
  .pill.C { background:var(--c); } .pill.R { background:var(--r); } .pill.H { background:var(--h); }
  .pill.z { background:#232837; color:#555d70; }
  .meta { flex-wrap:wrap; }
  .altpill { font-size:11px; font-weight:800; letter-spacing:.04em; padding:2px 8px; border-radius:99px; color:#fff;
             background:linear-gradient(135deg, #7b4dff, #c04dff); white-space:nowrap; }
  .altpill.ltd { background:linear-gradient(135deg, #b8860b, #e8b923); color:#241800; }
  .mlimit { text-align:center; font-size:14px; color:var(--dim); margin:2px 0 8px; line-height:1.7; }
  .mlimit b { color:var(--text); font-variant-numeric:tabular-nums; }
  .mlimit .ser { font-family:ui-monospace, Consolas, monospace; letter-spacing:.06em; }
  .mlimit .lim { color:#f0c24b; }
  .altpill.has { background:#2c2250; color:#cdbbff; border:1px solid #5d46a8; }

  /* leaderboard */
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:#1e2230; }
  td.rk { color:var(--dim); width:50px; }
  td a { text-decoration:none; font-weight:700; }
  td a:hover { color:var(--h); }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
  .updated { color:var(--dim); font-size:12px; margin:-6px 0 14px; }
</style>
<link rel="stylesheet" href="shared/effects.css">
<link rel="stylesheet" href="shared/cardtext.css">
<script src="shared/cardtext.js"></script>
<script src="shared/effects.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="/collection">← All collectors</a>
    <form class="find" id="find"><input id="q" placeholder="Twitch username" autocomplete="off" aria-label="Twitch username"><button>Look up</button></form>
  </div>
  <div class="updated" id="updated" hidden></div>
  <div id="app"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// The collection website (cardbot/publish.py) is a copy of this page on GitHub Pages with no bot behind it:
// each /api/... answer is a file next to the page (api/leaderboard.json, api/collection/<login>.json ...),
// and a viewer's page is ./?u=<login> instead of /collection/<login>. Plugin add-ons fetch /api/ too, so
// fetch itself is pointed at the files.
const STATIC = !!window.CARDS_STATIC;
if (STATIC) {
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => typeof url === "string" && url.startsWith("/api/")
    ? realFetch("api/" + url.slice(5) + ".json", { cache: "no-cache", ...opts })
    : realFetch(url, opts);
}
const userURL = l => STATIC ? "./?u=" + encodeURIComponent(l) : "/collection/" + encodeURIComponent(l);
const parts = location.pathname.replace(/\/+$/, "").split("/");
const login = STATIC ? (new URLSearchParams(location.search).get("u") || "").trim().replace(/^@/, "").toLowerCase() || null
                     : parts[2] ? decodeURIComponent(parts[2]) : null;
if (STATIC) document.querySelector(".home").href = "./";

$("find").onsubmit = e => {
  e.preventDefault();
  const v = $("q").value.trim().replace(/^@/, "").toLowerCase();
  if (v) location.href = userURL(v);
};

// "Updated 4 minutes ago" on the website, so nobody wonders why a card they just opened isn't there yet
async function showUpdated() {
  try {
    const d = await (await fetch("/api/updated")).json();
    const mins = Math.max(0, Math.round((Date.now() - Date.parse(d.at)) / 60000));
    const ago = mins < 1 ? "just now" : mins < 90 ? `${mins} minute${mins === 1 ? "" : "s"} ago`
              : mins < 48 * 60 ? `${Math.round(mins / 60)} hours ago` : `${Math.round(mins / 1440)} days ago`;
    $("updated").textContent = `Updated ${ago}. New cards show up here within about ${d.every_minutes || 10} minutes.`;
    $("updated").hidden = false;
  } catch {}
}
if (STATIC) showUpdated();

function frameClass(c) { return c.H > 0 ? "H" : c.R > 0 ? "R" : "C"; }

// Use art/back.png as the card back if it exists (same file the stream overlay uses).
const backImg = new Image();
backImg.onload = () => {
  document.documentElement.style.setProperty("--back-img", `url(${backImg.src})`);
  document.documentElement.classList.add("custom-back");
};
fetch("/api/back").then(r => r.json()).then(d => { if (d.url) backImg.src = d.url; }).catch(() => {});

function faceHTML(c, r) {
  const hue = (parseInt(c.id, 10) * 47 + (c.id.charCodeAt(4) - 65) * 23) % 360;
  const bdr = c.border ? `<img class="bdr" src="${esc(c.border)}" alt="">` : "";   // art/border-<letter>.png
  return (c.image
    ? `<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy">`
    : `<div class="ph${c.hide_name ? "" : " tx"}" style="--hue:${hue}"><div class="n">#${esc(c.id)}</div>${c.hide_name ? `<div class="t">${esc(c.name)}</div>` : ""}</div>`) + bdr + CardText.html(c, r);
}

// One tile per card number. Every border version of a card (0001A, 0001B...) is grouped under it.
const RORDER = ["H", "R", "C"];
function group(list) {
  const m = new Map();
  for (const c of list) {
    const n = c.id.slice(0, 4);
    if (!m.has(n)) m.set(n, { num: n, vs: [] });
    m.get(n).vs.push(c);
  }
  return [...m.values()].map(g => {
    g.vs.sort((a, b) => a.border_weight - b.border_weight || a.id.localeCompare(b.id));   // rarest border first
    const own = g.vs.filter(v => v.owned);
    g.owned = own.length > 0;
    g.name = own.length ? own[0].name : null;
    g.rarities = [...new Set(g.vs.flatMap(v => v.rarities))];
    g.limited = g.vs.some(v => Object.keys(v.limits || {}).length > 0);
    g.alt_of = g.vs[0].alt_of; g.alt_of_name = g.vs[0].alt_of_name; g.alts = g.vs[0].alts || [];
    return g;
  });
}
// every version of a card, best first: Holo (rarest border first), then Rare, then Common
function combos(g) {
  const out = [];
  for (const r of RORDER) for (const v of g.vs) if (v.rarities.includes(r) || v[r] > 0) out.push({ v, r });
  return out;
}
const bestCombo = g => combos(g).find(x => x.v[x.r] > 0);
const sumR = (g, k) => g.vs.reduce((n, v) => n + v[k], 0);

// "ALT of #0001" on an alt version, "ALT ART" on a card that has one (promo alts stay hidden until you own one)
function altPill(g) {
  if (g.alt_of) return `<span class="altpill" title="Alternate art of #${esc(g.alt_of)}${g.alt_of_name ? " " + esc(g.alt_of_name) : ""}">ALT of #${esc(g.alt_of)}</span>`;
  if (g.alts.length) return `<span class="altpill has" title="Has an alternate art version">ALT ART</span>`;
  return "";
}
const ltdPill = g => g.limited ? `<span class="altpill ltd" title="At least one version is a limited edition">LIMITED</span>` : "";

function tile(g) {
  if (!g.owned) {
    return `<div class="slot"><div class="frame none"><div class="backface"></div></div>
            <div class="meta"><span class="nm" style="color:#4a5164">#${esc(g.num)} · Not found yet</span>${altPill(g)}${ltdPill(g)}</div></div>`;
  }
  const b = bestCombo(g), c = b.v;     // the tile shows the best version you own
  const face = faceHTML(c, b.r);
  const pill = (k, n) => `<span class="pill ${n ? k : "z"}" title="${{H:"Holo",R:"Rare",C:"Common"}[k]}">${k} ${n}</span>`;
  return `<div class="slot owned" data-id="${esc(g.num)}" tabindex="0" role="button" aria-label="View ${esc(g.name)} larger"><div class="frame ${b.r}"><div class="face" data-fx="${b.r}">${face}</div></div>
          <div class="meta">${altPill(g)}${ltdPill(g)}<span class="pills">${RORDER.filter(k => g.rarities.includes(k) || sumR(g, k)).map(k => pill(k, sumR(g, k))).join("")}</span></div></div>`;
}

async function showUser() {
  const r = await fetch("/api/collection/" + encodeURIComponent(login));
  if (!r.ok) {
    document.title = "Not found";
    $("app").innerHTML = `<h1>${esc(login)}</h1><div class="empty">No collection yet — they haven't opened a card${STATIC ? " (or only just did)" : ""}, or the name is spelled differently.</div>`;
    return;
  }
  const d = await r.json();
  const G = group(d.cards), P = group(d.promos), multi = G.some(g => g.vs.length > 1);
  CARDS = G.concat(P);
  document.title = `${d.name}'s cards`;
  const holos = d.cards.reduce((n, c) => n + c.H, 0);
  const pct = d.of ? Math.round(d.unique / d.of * 100) : 0;
  $("app").innerHTML = `
    <h1>${esc(d.name)}'s collection</h1>
    <div class="sub">Frame colour shows the best version you own: silver common, gold rare, rainbow holo.</div>
    <div class="stats">
      <div class="stat"><b>${G.filter(g => g.owned).length} / ${G.length}</b><span>Cards found</span></div>
      ${multi ? `<div class="stat"><b>${d.unique} / ${d.of}</b><span>Border versions</span></div>` : ""}
      <div class="stat"><b>${d.total}</b><span>Total cards</span></div>
      <div class="stat"><b>${holos}</b><span>Holos</span></div>
    </div>
    <div class="bar" title="${pct}% complete"><i style="width:${pct}%"></i></div>
    <div id="addons-top"></div>
    <div class="grid">${G.map(tile).join("")}</div>
    ${P.length ? `<h2>Promos</h2><div class="grid">${P.map(tile).join("")}</div>` : ""}`;
  ADDONS.forEach(a => a.onUser && a.onUser(d));
}

// ---------- enlarge a card ----------
let CARDS = [], OWNED = [], cur = -1, selV = "", selR = "C", lastFocus = null;
const RNAME = { H: "Holo", R: "Rare", C: "Common" };

function pickBest() { const b = bestCombo(OWNED[cur]); selV = b.v.id; selR = b.r; }

function openCard(num) {
  OWNED = CARDS.filter(g => g.owned);
  cur = OWNED.findIndex(g => g.num === num);
  if (cur < 0) return;
  pickBest();
  lastFocus = document.activeElement;
  document.body.classList.add("modal-open");
  const m = document.createElement("div");
  m.className = "mback"; m.id = "modal";
  m.onclick = e => { if (e.target === m) closeCard(); };
  document.body.appendChild(m);
  renderCard();
}

function altNote(g) {
  const bits = [];
  if (g.alt_of) bits.push(`Alternate art of #${esc(g.alt_of)}${g.alt_of_name ? " " + esc(g.alt_of_name) : ""}`);
  if (g.alts.length) bits.push("Alternate art: " + g.alts.map(a => "#" + esc(a.num) + (a.name ? " " + esc(a.name) : "")).join(", "));
  return bits.length ? `<div style="margin-top:6px;color:#cdbbff">${bits.join(" · ")}</div>` : "";
}

function renderCard(focusTab) {
  const g = OWNED[cur], m = $("modal"), multi = OWNED.length > 1;
  const cs = combos(g), sel = cs.find(x => x.v.id === selV && x.r === selR) || bestCombo(g);
  const v = sel.v, r = sel.r, have = v[r] > 0, nb = g.vs.length;
  const lbl = (x, n) => (nb > 1 ? `${x.v.border_name} ` : "") + `${RNAME[x.r]} ×${n}`;
  const tab = x => `<button class="tab ${x.v[x.r] ? x.r : "z"}${x === sel ? " sel" : ""}" role="tab" aria-selected="${x === sel}" data-v="${esc(x.v.id)}" data-r="${x.r}" title="${esc(x.v.border_name)} ${RNAME[x.r]}">${esc(lbl(x, x.v[x.r]))}</button>`;
  // with several borders the versions stack in a grid: a row per rarity (best on top), a column per border
  const cells = nb > 1
    ? RORDER.filter(k => g.rarities.includes(k) || sumR(g, k)).flatMap(k => g.vs.map(w => cs.find(x => x.v === w && x.r === k)))
        .map(x => x ? tab(x) : "<span></span>").join("")
    : cs.map(tab).join("");
  const hint = [multi ? "← → other cards" : "", cs.length > 1 ? "↑ ↓ other versions" : ""].filter(Boolean).join(" · ");
  m.innerHTML = `
    <button class="mclose" aria-label="Close">✕</button>
    ${multi ? `<button class="mnav prev" aria-label="Previous card">‹</button><button class="mnav next" aria-label="Next card">›</button>` : ""}
    <div class="mbox${nb > 1 ? " multi" : ""}" role="dialog" aria-modal="true" aria-label="${esc(g.name)}">
      <div class="big">${have
        ? `<div class="frame ${r}"><div class="face" data-fx="${r}">${faceHTML(v, r)}</div></div>`
        : `<div class="frame none"><div class="backface"></div></div>`}</div>
      <div class="mlimit"><span class="ser">Serial <b>${esc(v.id + r)}</b></span>${v.limits && v.limits[r] ? ` · <span class="lim">Limit <b>${v.limits[r]}</b></span> · Found <b>${v.found[r]}</b>${v.found[r] >= v.limits[r] ? " (all claimed)" : ""}` : ""}</div>
      ${ADDONS.map(a => a.cardHTML ? a.cardHTML(g, v, r, have) : "").join("")}
      <div class="mtabs${nb > 1 ? " grid2" : ""}" style="--cols:${nb}" role="tablist" aria-label="Versions">${cells}</div>
      <div class="mnote">${have ? "" : `You haven't found the ${nb > 1 ? esc(v.border_name) + " " : ""}${RNAME[r]} version yet.`}${altNote(g)}</div>
      <div class="mhint">${hint}</div>
    </div>`;
  m.querySelector(".mclose").onclick = closeCard;
  ADDONS.forEach(a => a.bindCard && a.bindCard(m, g, v, r));
  if (multi) {
    m.querySelector(".prev").onclick = () => step(-1);
    m.querySelector(".next").onclick = () => step(1);
  }
  m.querySelectorAll(".tab").forEach(b => b.onclick = () => { selV = b.dataset.v; selR = b.dataset.r; renderCard(true); });
  CardFX.attach(m);
  const big = m.querySelector(".big"), fr = big.querySelector(".frame"), face = big.querySelector(".face");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    big.onpointermove = e => {            // gentle 3D tilt; holo foil follows the pointer
      const rc = big.getBoundingClientRect();
      const x = (e.clientX - rc.left) / rc.width, y = (e.clientY - rc.top) / rc.height;
      fr.style.transform = `rotateY(${(x - .5) * 14}deg) rotateX(${-(y - .5) * 14}deg)`;
      if (face) CardFX.live(face, x, y);
    };
    big.onpointerleave = () => { fr.style.transform = ""; if (face) CardFX.live(face, null); };
  }
  (focusTab && m.querySelector(".tab.sel") || m.querySelector(".mclose")).focus();
}

function step(d) { cur = (cur + d + OWNED.length) % OWNED.length; pickBest(); renderCard(); }

function stepVersion(d) {
  const cs = combos(OWNED[cur]);
  if (cs.length < 2) return;
  const i = cs.findIndex(x => x.v.id === selV && x.r === selR);
  const n = cs[(i + d + cs.length) % cs.length];
  selV = n.v.id; selR = n.r;
  renderCard(true);
}

function closeCard() {
  const m = $("modal"); if (!m) return;
  m.remove();
  document.body.classList.remove("modal-open");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

$("app").addEventListener("click", e => {
  const s = e.target.closest(".slot.owned"); if (s) openCard(s.dataset.id);
});
$("app").addEventListener("keydown", e => {
  const s = e.target.closest && e.target.closest(".slot.owned");
  if (s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCard(s.dataset.id); }
});
document.addEventListener("keydown", e => {
  const m = $("modal"); if (!m) return;
  if (e.key === "Escape") closeCard();
  else if (e.key === "ArrowLeft" && OWNED.length > 1) step(-1);
  else if (e.key === "ArrowRight" && OWNED.length > 1) step(1);
  else if (e.key === "ArrowUp")   { e.preventDefault(); stepVersion(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); stepVersion(1); }
  else if (e.key === "Tab") {               // keep keyboard focus inside the dialog
    const f = [...m.querySelectorAll("button")];
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});

async function showBoard() {
  document.title = "Card Collections";
  const d = await (await fetch("/api/leaderboard")).json();
  if (!d.users.length) { $("app").innerHTML = `<h1>Card collections</h1><div class="empty">Nobody has opened a card yet.</div>`; return; }
  $("app").innerHTML = `<h1>Card collections</h1><div class="sub">Ranked by cards found${d.multi ? " (each border version counts as its own card)" : ""}, then holos, then total cards.</div>
    <table><thead><tr><th>#</th><th>Collector</th><th>Found</th><th>Holos</th><th>Total</th></tr></thead><tbody>
    ${d.users.map((u, i) => `<tr><td class="rk">${i + 1}</td>
      <td><a href="${esc(userURL(u.login))}">${esc(u.display_name)}</a></td>
      <td>${u.unique_cards} / ${d.of}</td><td>${u.holos}</td><td>${u.total_cards}</td></tr>`).join("")}
    </tbody></table>`;
}

// ---------- add-ons (plugins can add things to these pages, e.g. the Triple Triad hand builder) ----------
const ADDONS = [];
window.Collection = { login, esc, $, get cards() { return CARDS; }, add: a => ADDONS.push(a),
                      rerender: () => { if ($("modal")) renderCard(); } };
async function loadAddons() {
  try {
    const f = await (await fetch("/api/features")).json();
    await Promise.all(Object.values(f).filter(x => x && x.collection_js).map(x => new Promise(res => {
      const s = document.createElement("script"); s.src = x.collection_js; s.onload = s.onerror = res; document.head.appendChild(s);
    })));
  } catch {}
}

loadAddons().then(() => login ? showUser().then(() => CardFX.attach($("app"))) : showBoard()).catch(() => { $("app").innerHTML = `<div class="empty">${STATIC ? "Couldn't load. Try again in a minute." : "Couldn't load. Is the bot running?"}</div>`; });
</script>
</body>
</html>
